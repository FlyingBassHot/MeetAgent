# MeetAgent Node — V2.1 本地开发配置
#
# V2.1 以 Node 为中心：默认启动本地 HTTP/WSS 服务，Mobile/Terminal 直接
# 连接 Node；Cloud 仅作为可选 relay（默认关闭）。
node:
  id: "node-001"
  name: "developer-machine"
  token: "dev-node-token-change-me"

  # Node 级本地安全策略。未列出的动作一律拒绝，且不能超出协议白名单。
  # 本地开发配置显式开启 permission_response，用于验证真实权限审批链路。
  # 生产部署请先移除该动作，只对可信 Device 开放（见根 README 安全说明）。
  policy:
    allowed_actions:
      - ping
      - echo
      - get_status
      - send_prompt
      - interrupt
      - list_sessions
      - permission_response
    max_prompt_bytes: 32768

  agents:
    - id: "opencode-main"
      type: "opencode"
      name: "OpenCode Main"
      enabled: true
      connection:
        # 本机 OpenCode 服务地址；密码推荐用环境变量注入。
        #   export OPENCODE_PASSWORD="$(opencode service get password)"
        base_url: "http://127.0.0.1:49374"
        username: "opencode"
        password_env: "OPENCODE_PASSWORD"
        # 可选：只暴露某个项目目录的 Session。
        directory: ""
        timeout: 15s
      capabilities:
        send_prompt: true
        interrupt: true
        list_sessions: true

server:
  enabled: true
  addr: "0.0.0.0:8787"
  allowed_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:5174"
    - "http://127.0.0.1:5174"
    - "http://localhost:4173"
    - "http://127.0.0.1:4173"
  event_buffer: 1000
  event_ttl: 1h
  snapshot_events: 100
  pairing_ttl: 10m
  admin_token: "dev-admin-token-change-me"
  pairing_store: "./data/paired-clients.json"
  default_permissions:
    - "session.read"
    - "session.control"
    - "permission.respond"
  mdns: true
  command_timeout: 15s
  read_timeout: 90s

cloud:
  enabled: false
  url: "ws://127.0.0.1:8080/ws"
  register_timeout: 10s
  heartbeat_interval: 20s
  read_timeout: 60s
  request_timeout: 15s
  reconnect:
    initial_delay: 1s
    max_delay: 30s
    multiplier: 2
    jitter: 0.2

log:
  level: info